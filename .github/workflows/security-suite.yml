name: Security Suite

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  security-events: write
  pull-requests: write

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-path gitleaks-report.json --redact --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sca-analysis:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.directory }}
          npm ci

      - name: Run npm audit
        run: |
          cd ${{ matrix.directory }}
          npm audit --audit-level=high

  sast-codeql:
    name: SAST (GitHub CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sast-sonar:
    name: SAST (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca-analysis, sast-sonar, sast-codeql]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Start Backend
        run: |
          cd backend
          npm ci
          npm run build
          mkdir -p data
          npm run migrate:latest
          npm start &
          echo "Waiting for Backend..."
          sleep 5
      
      - name: Install and Start Frontend
        run: |
          cd frontend
          npm ci
          npm run build &
          npm run preview -- --port 5173 &
          echo "Waiting for Frontend..."
          sleep 5
      - name: Make workspace writable for ZAP
        run: |
          # Ensure the mounted workspace is writable by the ZAP docker container
          # Create a dedicated folder for ZAP outputs and make it writable (safer than chmod -R)
          mkdir -p $GITHUB_WORKSPACE/.zap-output
          sudo chmod -R a+rwx $GITHUB_WORKSPACE/.zap-output || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5173'
          allow_issue_writing: false
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # Do NOT let the action attempt to upload artifacts itself (some runners reject names).
          # We will upload the report files explicitly using `actions/upload-artifact` below.
          upload_report: false
          # Write reports into the workspace folder we created
          zap_output_dir: '.zap-output'

      - name: Upload ZAP reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: .zap-output/**

  sbom-generation:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    needs: [dast-zap]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json
